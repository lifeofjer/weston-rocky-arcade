 if(A.rev>0){A.rev-=dt;return{thr:-1,steer:A.revS}}
 const sp=Math.hypot(c.vx,c.vy);if(sp<.25){A.stuck+=dt;if(A.stuck>60){A.stuck=0;A.rev=35;A.revS=Math.random()<.5?-1:1}}else A.stuck=0;
 if(!c.node){c.node=NODES[0]}
 if(Math.hypot(c.node.x-c.x,c.node.y-c.y)<10){const nb=nbrs(c.node).filter(n=>n!==c.prev);const nx=nb[Math.random()*nb.length|0]||c.prev;c.prev=c.node;c.node=nx}
 let da=Math.atan2(c.node.y-c.y,c.node.x-c.x)-c.a;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
 return{thr:Math.abs(da)>1.2?.35:.7,steer:Math.max(-1,Math.min(1,da*3))}}
function pushOut(c){let hit=0;for(let it=0;it<2;it++)for(const p of circles(c)){let dx=0,dy=0;
  if(p.x<AX0+R)dx=AX0+R-p.x;if(p.x>AX1-R)dx=AX1-R-p.x;if(p.y<AY0+R)dy=AY0+R-p.y;if(p.y>AY1-R)dy=AY1-R-p.y;
  for(const b of BLD){const nx=Math.max(b.x,Math.min(p.x,b.x+b.w)),ny=Math.max(b.y,Math.min(p.y,b.y+b.h));const ex=p.x-nx,ey=p.y-ny,d=Math.hypot(ex,ey);if(d<R){if(d>0){dx+=ex/d*(R-d);dy+=ey/d*(R-d)}else{dy-=R}}}
  if(dx||dy){c.x+=dx;c.y+=dy;const l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l,vn=c.vx*ux+c.vy*uy;if(vn<0){hit=Math.max(hit,-vn);c.vx-=1.5*vn*ux;c.vy-=1.5*vn*uy}}}
 return hit}

function update(dt){
 for(const c of cars){
  if(c.dead){c.deadT-=dt;if(c.deadT<=0)spawnAI(c);continue}
  if(c.inv>0)c.inv-=dt;if(c.cd>0)c.cd-=dt;
  const cs=ROSTER[c.ci];let ctl=c.who===0?(state==='play'?ctlPlayer():{thr:0,steer:0}):ctlAI(c,dt);
  const wear=c.who===0?1-c.crashes*.035:.8;
  const fx=Math.cos(c.a),fy=Math.sin(c.a);let fwd=c.vx*fx+c.vy*fy,lat=-c.vx*fy+c.vy*fx;
  fwd+=ctl.thr*cs.acc*dt*(ctl.thr<0&&fwd>0?1.6:1);const top=cs.top*wear;fwd=Math.max(-top*.5,Math.min(top,fwd));
  fwd*=Math.pow(c.who===0&&state==='break'?.93:.985,dt);lat*=Math.pow(.85,dt);
  c.a+=ctl.steer*cs.turn*dt*Math.max(-1,Math.min(1,fwd/1.2))+c.spin*dt;c.spin*=Math.pow(.95,dt);if(Math.abs(c.spin)<.005)c.spin=0;
  const nfx=Math.cos(c.a),nfy=Math.sin(c.a);c.vx=nfx*fwd-nfy*lat;c.vy=nfy*fwd+nfx*lat;c.x+=c.vx*dt;c.y+=c.vy*dt;
  const wh=pushOut(c);if(wh>1&&c.who===0){crunch(wh*.5);sparks(c.x,c.y,4)}
  // smoke
  const lvl=c.who===0?c.crashes:(100-c.hp)/10;
  if(lvl>=3){c.smokeT-=dt;if(c.smokeT<=0){c.smokeT=lvl>=8?2:lvl>=6?4:8;parts.push({x:c.x-nfx*7,y:c.y-nfy*7,vx:rand(-.2,.2),vy:rand(-.4,-.1),t:50,max:50,type:lvl>=8&&Math.random()<.4?'fire':'smoke',sz:lvl>=6?3:2})}}
 }
 // car-car collisions (multi-circle)
 for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const A=cars[i],B=cars[j];if(A.dead||B.dead)continue;if(Math.hypot(A.x-B.x,A.y-B.y)>50)continue;
  let bestP=null;for(const p of circles(A))for(const q of circles(B)){const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<2*R&&(!bestP||d<bestP.d))bestP={dx,dy,d}}
  if(!bestP)continue;const d=bestP.d||.01,nx=bestP.dx/d||1,ny=bestP.dy/d,ov=2*R-d,mA=ROSTER[A.ci].mass,mB=ROSTER[B.ci].mass;
  A.x-=nx*ov*mB/(mA+mB);A.y-=ny*ov*mB/(mA+mB);B.x+=nx*ov*mA/(mA+mB);B.y+=ny*ov*mA/(mA+mB);
  const rv=(A.vx-B.vx)*nx+(A.vy-B.vy)*ny;if(rv<=0)continue;
  const jimp=1.7*rv/(1/mA+1/mB);A.vx-=jimp/mA*nx;A.vy-=jimp/mA*ny;B.vx+=jimp/mB*nx;B.vy+=jimp/mB*ny;
  sparks(A.x+nx*6,A.y+ny*6,4+rv*3|0);
  if(rv>.5){if(A.who===0)playerCrash(B,rv);else if(B.who===0)playerCrash(A,rv);else if(rv>1){hitAI(A,rv*5,null);hitAI(B,rv*5,null)}}}
 for(const p of parts){p.t-=dt;p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;if(p.type==='part'){p.z+=p.vz*dt;p.vz-=.12*dt;if(p.z<0){p.z=0;p.vz*=-.4;p.vx*=.7;p.vy*=.7}p.rot+=.2*dt}else if(p.vx!==undefined){p.vx*=.95;p.vy*=.95}}
 parts=parts.filter(p=>p.t>0);for(const f of floaters){f.t-=dt;f.y-=.3*dt}floaters=floaters.filter(f=>f.t>0);
 if(msgT>0&&msgT<9000)msgT-=dt;if(shake>0)shake=Math.max(0,shake-.5*dt);
 if(state==='break'){const p=player;breakT+=dt;
  if((breakT|0)%14===0&&breakT<140)snd(rand(55,90),.12,'sawtooth',.07);
  if(Math.random()<.5*dt)parts.push({x:p.x+rand(-5,5),y:p.y+rand(-5,5),vx:rand(-.3,.3),vy:rand(-.7,-.2),t:70,max:70,type:'smoke',sz:rand(3,6)});
  if(breakT>90&&!p.fell){p.fell=true;flyParts(p,18,false);pop(p.x,p.y,14,false);noise(.5,.35,900);shake=5}
  if(breakT>230){state='select';fromBreak=true;brand=(brand+1+(Math.random()*(BRANDS.length-1)|0))%BRANDS.length;pick=0;msgT=0}}
}
