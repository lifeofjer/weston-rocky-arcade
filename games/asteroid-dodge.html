<!DOCTYPE html><html><head><meta charset="utf-8"><title>Asteroid Dodge - Weston & Rocky Arcade</title>
<style>html,body{margin:0;background:#000;height:100%;display:flex;align-items:center;justify-content:center;font-family:monospace;color:#fff}canvas{image-rendering:pixelated;width:min(96vw,128vh);height:auto;border:4px solid #444}a{color:#ff0;position:fixed;top:8px;left:8px}</style></head>
<body><a href="/">&larr; ARCADE</a><canvas id="c" width="320" height="240"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=320,H=240;
let AC;function beep(f,d,t='square',v=.08){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const keys={};let state='title',car,rocks,stars,score,best=+(localStorage.adBest||0),t,boom,touchX=null;
stars=[...Array(60)].map(()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.5}));
function reset(){car={x:W/2,y:H-30};rocks=[];score=0;t=0;boom=null;state='play';beep(660,.15)}
addEventListener('keydown',e=>{keys[e.code]=1;if((e.code==='Space'||e.code==='Enter')&&state!=='play')reset()});
addEventListener('keyup',e=>keys[e.code]=0);
c.addEventListener('pointerdown',e=>{if(state!=='play')reset();touchX=e.offsetX/c.clientWidth*W});
c.addEventListener('pointermove',e=>{if(e.buttons)touchX=e.offsetX/c.clientWidth*W});
c.addEventListener('pointerup',()=>touchX=null);
function drawCar(px,py){x.fillStyle='#d00';x.fillRect(px-7,py-12,14,24);x.fillStyle='#ff4';x.fillRect(px-5,py-12,3,3);x.fillRect(px+2,py-12,3,3);x.fillStyle='#8cf';x.fillRect(px-5,py-6,10,5);x.fillStyle='#111';x.fillRect(px-9,py-9,3,6);x.fillRect(px+6,py-9,3,6);x.fillRect(px-9,py+4,3,6);x.fillRect(px+6,py+4,3,6);x.fillStyle='#f80';if(state==='play'&&t%6<3)x.fillRect(px-3,py+12,6,4)}
function text(s,px,py,col='#fff',sz=16){x.fillStyle=col;x.font='bold '+sz+'px monospace';x.textAlign='center';x.fillText(s,px,py)}
function step(){t++;
 x.fillStyle='#000';x.fillRect(0,0,W,H);
 for(const s of stars){s.y+=s.s*(state==='play'?1+score/600:.5);if(s.y>H){s.y=0;s.x=Math.random()*W}x.fillStyle=s.s>1.8?'#fff':'#666';x.fillRect(s.x|0,s.y|0,1,1)}
 if(state==='title'){text('ASTEROID DODGE',W/2,70,'#ff0',22);text('BY WESTON AND ROCKY',W/2,92,'#8cf',10);drawCar(W/2,140);text('ARROWS OR A/D OR DRAG TO STEER',W/2,185,'#fff',9);text('PRESS SPACE OR TAP TO START',W/2,205,t%40<20?'#0f0':'#060',10);if(best)text('BEST '+best,W/2,225,'#f80',9)}
 if(state==='play'){
  const sp=3.2;if(keys.ArrowLeft||keys.KeyA)car.x-=sp;if(keys.ArrowRight||keys.KeyD)car.x+=sp;
  if(touchX!=null)car.x+=Math.max(-sp,Math.min(sp,touchX-car.x));car.x=Math.max(10,Math.min(W-10,car.x));
  score++;const rate=Math.max(6,28-score/90|0);if(t%rate===0)rocks.push({x:Math.random()*W,y:-10,r:5+Math.random()*9,v:1.5+Math.random()*1.5+score/700});
  for(const r of rocks){r.y+=r.v;x.fillStyle='#a87';x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.fill();x.fillStyle='#765';x.fillRect(r.x-r.r/3,r.y-r.r/3,r.r/2,r.r/2);
   if(Math.abs(r.x-car.x)<r.r+6&&Math.abs(r.y-car.y)<r.r+11){state='over';boom=[...Array(40)].map(()=>({x:car.x,y:car.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:40}));beep(80,.6,'sawtooth',.15);beep(50,.8,'square',.1);if(score>best){best=score;localStorage.adBest=best}}}
  rocks=rocks.filter(r=>r.y<H+20);if(state==='play'){drawCar(car.x,car.y);if(score%300===0)beep(880,.08)}
  text('SCORE '+score,W/2,16,'#ff0',12)}
 if(state==='over'){for(const p of boom){p.x+=p.vx;p.y+=p.vy;p.l--;x.fillStyle=['#ff0','#f80','#f00'][p.l%3];if(p.l>0)x.fillRect(p.x,p.y,3,3)}
  text('BOOM!',W/2,80,'#f80',28);text('SCORE '+score+'   BEST '+best,W/2,110,'#fff',12);text(score>=best&&score>0?'NEW RECORD! AMAZE AMAZE!':'ROCKY SAYS: AGAIN! AGAIN!',W/2,140,'#8cf',10);text('SPACE OR TAP TO PLAY AGAIN',W/2,180,t%40<20?'#0f0':'#060',10)}
 requestAnimationFrame(step)}
step();
</script></body></html>
