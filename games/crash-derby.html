  if(c.air<=0)for(const b of barrels){if(b.alive&&Math.hypot(c.x-b.x,c.y-b.y)<R+3)barrelBoom(b,c)}
  // smoke
  if(c.hp<60){c.smokeT-=dt;if(c.smokeT<=0){c.smokeT=c.hp<30?3:8;parts.push({x:c.x-nfx*5,y:c.y-nfy*5,vx:rand(-.2,.2),vy:rand(-.4,-.1),t:50,max:50,type:c.hp<30&&Math.random()<.5?'fire':'smoke',sz:c.hp<30?3:2})}}
 }
 // car-car
 for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const A=cars[i],B=cars[j];if(A.dead||B.dead||A.air>0||B.air>0)continue;
  const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);if(d>=14||d===0)continue;
  const nx=dx/d,ny=dy/d,ov=14-d,mA=CARS[A.ci].mass,mB=CARS[B.ci].mass;
  A.x-=nx*ov*mB/(mA+mB);A.y-=ny*ov*mB/(mA+mB);B.x+=nx*ov*mA/(mA+mB);B.y+=ny*ov*mA/(mA+mB);
  const rv=(A.vx-B.vx)*nx+(A.vy-B.vy)*ny;if(rv<=0)continue;
  const jimp=1.6*rv/(1/mA+1/mB);A.vx-=jimp/mA*nx;A.vy-=jimp/mA*ny;B.vx+=jimp/mB*nx;B.vy+=jimp/mB*ny;
  const aIn=Math.max(0,(A.vx+jimp/mA*nx)*nx+(A.vy+jimp/mA*ny)*ny),bIn=Math.max(0,-((B.vx-jimp/mB*nx)*nx+(B.vy-jimp/mB*ny)*ny));
  if(rv>.6){const base=rv*4;hurt(B,(base+aIn*9)*mA,A);hurt(A,(base+bIn*9)*mB,B);crunch(rv);sparks(A.x+nx*5,A.y+ny*5,6+rv*3|0);if(rv>2)shake=Math.max(shake,4+rv)}}
 for(const b of barrels)if(!b.alive){b.t-=dt;if(b.t<=0){let ok=true;for(const c of cars)if(Math.hypot(c.x-b.x,c.y-b.y)<14)ok=false;if(ok)b.alive=true}}
 for(const p of parts){p.t-=dt;p.x+=p.vx*dt||0;p.y+=p.vy*dt||0;if(p.type==='part'){p.z+=p.vz*dt;p.vz-=.12*dt;if(p.z<0){p.z=0;p.vz*=-.4;p.vx*=.7;p.vy*=.7}p.rot+=.2*dt}else if(p.vx!==undefined){p.vx*=.95;p.vy*=.95}}
 parts=parts.filter(p=>p.t>0);
 for(const f of floaters){f.t-=dt;f.y-=.3*dt}floaters=floaters.filter(f=>f.t>0);
 if(msgT>0)msgT-=dt;if(shake>0)shake=Math.max(0,shake-.5*dt);
}
function land(c){shake=Math.max(shake,3);crunch(1.5);
 for(const o of cars){if(o===c||o.dead||o.air>0)continue;if(Math.hypot(o.x-c.x,o.y-c.y)<16){hurt(o,55,c);hurt(c,8,o);sparks(o.x,o.y,14);shake=8;if(c.who>=0){c.score+=50;floaters.push({x:o.x,y:o.y-16,s:'SQUISH +50',t:70,col:'#ff0'});say('ROCKY: LANDED ON CAR! AMAZE!')}}}}
function sparks(x,y,n){for(let i=0;i<n;i++){const a=rand(0,6.28),s=rand(.5,2.5);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:rand(8,18),max:18,type:'spark'})}}
// ---------- draw ----------
function drawArena(){
 g.fillStyle='#4a4038';g.fillRect(0,TOP,W,H-TOP);
 g.fillStyle='#544a40';for(let i=0;i<220;i++)g.fillRect((i*97)%W,TOP+(i*61)%(H-TOP),2,1);
 g.fillStyle='#3c332c';for(let i=0;i<30;i++)g.fillRect((i*173+40)%300+10,TOP+20+(i*89)%150,6,3);
 // walls: tire wall with stripes
 for(let x=0;x<W;x+=8){g.fillStyle=(x/8)%2?'#e02020':'#fff';g.fillRect(x,TOP,8,6);g.fillRect(x,H-6,8,6)}
 for(let y=TOP;y<H;y+=8){g.fillStyle=((y-TOP)/8)%2?'#e02020':'#fff';g.fillRect(0,y,6,8);g.fillRect(W-6,y,6,8)}
 for(const b of BLOCKS){g.fillStyle='#8a8a92';g.fillRect(b.x,b.y,b.w,b.h);g.fillStyle='#b4b4bc';g.fillRect(b.x,b.y,b.w,2);g.fillStyle='#5a5a62';g.fillRect(b.x,b.y+b.h-2,b.w,2)}
 for(const r of RAMPS){g.fillStyle='#6b5a2a';g.fillRect(r.x,r.y,r.w,r.h);for(let i=0;i<r.w;i+=4){g.fillStyle=(i/4)%2?'#ffd21e':'#222';g.fillRect(r.x+i,r.y,2,r.h)}g.fillStyle='#fff6a0';g.fillRect(r.x,r.y,r.w,1);txt('JUMP',r.x+r.w/2,r.y+r.h/2-3,'#fff',1,true)}
 for(const b of barrels){if(!b.alive)continue;g.fillStyle='#000';g.fillRect(b.x-3,b.y-1,8,6);g.fillStyle='#e02020';g.fillRect(b.x-4,b.y-4,8,8);g.fillStyle='#ff7070';g.fillRect(b.x-3,b.y-3,3,3);g.fillStyle='#ffd21e';g.fillRect(b.x-4,b.y-1,8,1);g.fillStyle='#000';g.fillRect(b.x-1,b.y-3,2,1)}}
function drawCar(c,now){
 if(c.dead)return;
 const z=c.air>0?Math.sin(Math.PI*(1-c.air/c.airMax))*8:0,sc=1+z/14;
 g.fillStyle='rgba(0,0,0,.4)';g.fillRect(c.x-7+z*.6,c.y-7+z*.8,14,14);
 if(c.inv>0&&(now/80|0)%2&&c.build<=0)return;
 g.save();g.translate(Math.round(c.x),Math.round(c.y-z));g.rotate(c.a+Math.PI/2);g.scale(sc*1.5,sc*1.5);
 g.drawImage(IMG[c.ci],-4,-6.5);
 g.fillStyle='rgba(20,15,10,.75)';for(const[dx,dy]of c.dents)g.fillRect(dx-4,dy-6.5,1,1);
 if(c.hp<30){g.fillStyle=(now/100|0)%2?'#ff4010':'#ffd21e';g.fillRect(-2,-6,3,2)}
 g.restore();
 // rebuild effect: white xenonite blocks flying in
 if(c.build>0){const k=c.build/60;g.fillStyle='#fff';for(let i=0;i<10;i++){const a=i*0.628+now/300;g.fillRect(c.x+Math.cos(a)*k*30-1,c.y+Math.sin(a)*k*30-1,3,3)}}
 // owner tag
 if(c.who>=0){const col=c.who?'#5ab0ff':'#ff5a5a';txt('P'+(c.who+1),c.x,c.y-z-19,col,1,true)}
 // hp bar
 g.fillStyle='#000';g.fillRect(c.x-6,c.y-z-12,12,2);g.fillStyle=c.hp>60?'#4cff6a':c.hp>30?'#ffd21e':'#ff3b3b';g.fillRect(c.x-6,c.y-z-12,Math.max(0,12*c.hp/100)|0,2)}
function drawParts(){for(const p of parts){const k=p.t/p.max;
 if(p.type==='fire'){g.fillStyle=k>.7?'#fff6a0':k>.45?'#ffd21e':k>.2?'#ff7a1a':'#b02010';const s=p.sz*(0.6+k);g.fillRect(p.x-s/2,p.y-s/2,s,s)}
 else if(p.type==='smoke'){g.fillStyle='rgba(60,60,60,'+(k*.6)+')';const s=p.sz*(1.6-k);g.fillRect(p.x-s/2,p.y-s/2,s,s)}
 else if(p.type==='spark'){g.fillStyle=k>.5?'#fff':'#ffd21e';g.fillRect(p.x,p.y,1,1)}
 else if(p.type==='ring'){const r=(1-k)*34;g.strokeStyle='rgba(255,240,160,'+k+')';g.lineWidth=2;g.beginPath();g.arc(p.x,p.y,r,0,7);g.stroke()}
 else if(p.type==='part'){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(p.x,p.y,p.sz,p.sz);g.save();g.translate(p.x,p.y-p.z*4);g.rotate(p.rot);g.fillStyle=p.col;g.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz);g.restore()}}}
function hud(){g.fillStyle='#10102c';g.fillRect(0,0,W,TOP);
 const hs=cars.filter(c=>c.who>=0);
 for(const c of hs){const x=c.who?W-118:4,col=c.who?'#5ab0ff':'#ff5a5a';txt('P'+(c.who+1)+' '+c.score,x,4,col);
  g.fillStyle='#333';g.fillRect(x+50,4,60,6);g.fillStyle=c.hp>60?'#4cff6a':c.hp>30?'#ffd21e':'#ff3b3b';g.fillRect(x+50,4,60*Math.max(0,c.hp)/100|0,6);if(c.dead)txt('REBUILD',x+58,4,'#fff')}
 const t=Math.max(0,Math.ceil(timeLeft)),s=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
 txt(s,W/2,4,t<=10?'#ff4040':'#fff',1,true);
 if(players==1)txt('BEST '+best,W-6-textW('BEST '+best),4,'#ffd21e')}
function rockyFace(x,y,s=1){// little Eridian: rocky carapace + legs
 g.fillStyle='#6b5a48';g.fillRect(x+2*s,y,8*s,6*s);g.fillRect(x,y+2*s,12*s,3*s);g.fillStyle='#8a7660';g.fillRect(x+3*s,y+1*s,3*s,2*s);
 g.fillStyle='#4a3d30';for(let i=0;i<5;i++)g.fillRect(x+(i*2.6+.5)*s,y+6*s,s,4*s)}
function title(now){
 g.fillStyle='#1a0f08';g.fillRect(0,0,W,H);
 for(let i=0;i<50;i++){const k=((now/8+i*40)%400)/400;g.fillStyle=k<.5?'#ff7a1a':'#b02010';g.fillRect((i*67)%W,H-(k*120)|0,2,2)}
 shadowTxt('CRASH',W/2,30,'#ffd21e',5,true);shadowTxt('DERBY',W/2,66,'#ff4040',5,true);
 const sh=(now/90|0)%2;drawCarBig(0,92+sh,110,3);drawCarBig(5,204-sh,110,3);
 if((now/300|0)%3==0){g.fillStyle='#fff6a0';for(let i=0;i<8;i++)g.fillRect(150+Math.cos(i)*12+rand(-2,2),128+Math.sin(i)*12,4,4);txt('BOOM!',W/2,124,'#ff4040',2,true)}
 if((now/400|0)%2)shadowTxt('PRESS SPACE TO START',W/2,162,'#fff',1,true);
 txt('BY WESTON AND ROCKY',W/2,174,'#7cf',1,true);rockyFace(150,182)}
function select(now){
 g.fillStyle='#10102c';g.fillRect(0,0,W,H);
 shadowTxt('PICK YOUR CAR',W/2,8,'#ffd21e',2,true);
 txt(players==1?'1 PLAYER   (PRESS 2 FOR 2 PLAYERS)':'2 PLAYERS   (PRESS 1 FOR 1 PLAYER)',W/2,26,'#7cf',1,true);
 const n=players;for(let i=0;i<n;i++){const x0=n==1?80:i*160,w=n==1?160:160,c=CARS[sel[i]],col=i?'#5ab0ff':'#ff5a5a';
  g.fillStyle='#1d1d48';g.fillRect(x0+10,38,w-20,118);g.fillStyle=col;g.fillRect(x0+10,38,w-20,2);
  shadowTxt(i?'PLAYER 2':'PLAYER 1',x0+w/2,44,col,1,true);drawCarBig(sel[i],x0+w/2-16,56,4);shadowTxt(c.name,x0+w/2,112,'#fff',1,true);
  const bar=(lbl,v,y)=>{txt(lbl,x0+22,y,'#aaa');g.fillStyle='#333';g.fillRect(x0+70,y,60,5);g.fillStyle=col;g.fillRect(x0+70,y,60*Math.max(.1,Math.min(1,v))|0,5)};
  bar('SPEED',(c.top-1.8)/0.8,124);bar('TOUGH',(1.2-c.armor)/0.6+.15,133);
  txt(n==1?'ARROWS OR A/D TO CHANGE':(i?'LEFT/RIGHT TO CHANGE':'A/D TO CHANGE'),x0+w/2,145,'#888',1,true)}
 txt(players==1?'DRIVE: ARROWS OR WASD':'P1 DRIVES WASD   P2 DRIVES ARROWS',W/2,162,'#aaa',1,true);
 if((now/400|0)%2)shadowTxt('SPACE = CRASH!',W/2,176,'#4cff6a',2,true)}
function done(now){
 g.fillStyle='rgba(0,0,0,.78)';g.fillRect(20,30,280,140);
 const hs=cars.filter(c=>c.who>=0);
 if(players==2){const a=hs[0].score,b=hs[1].score;shadowTxt(a==b?'TIE!':(a>b?'PLAYER 1 WINS!':'PLAYER 2 WINS!'),W/2,42,a==b?'#ffd21e':a>b?'#ff5a5a':'#5ab0ff',3,true)}
 else shadowTxt('TIME UP!',W/2,42,'#ffd21e',3,true);
 hs.forEach((c,i)=>{const y=74+i*22;drawCarBig(c.ci,60,y-6,1);txt('P'+(c.who+1)+'  SCORE '+c.score+'   KOS '+c.kills,80,y,c.who?'#5ab0ff':'#ff5a5a')});
 if(players==1)txt('BEST '+best,W/2,104,'#ffd21e',1,true);
 rockyFace(70,124);txt('ROCKY: GOOD GOOD! SO MANY CRASH!',90,128,'#fff');
 if((now/400|0)%2)txt('SPACE = PLAY AGAIN',W/2,152,'#4cff6a',1,true)}
function loop(now){
 const dt=Math.min((now-last)/16.67,3);last=now;tNow=now;
 if(state==='title')title(now);
 else if(state==='select')select(now);
 else{
  if(state==='play')update(dt);
  g.save();if(shake>0)g.translate(rand(-shake,shake)|0,rand(-shake,shake)|0);
  drawArena();drawParts();for(const c of cars)drawCar(c,now);
  for(const f of floaters)shadowTxt(f.s,f.x,f.y,f.col,f.sc||1,true);
  g.restore();hud();
  if(msgT>0&&state==='play'){g.fillStyle='rgba(0,0,0,.7)';g.fillRect(40,H-30,240,16);rockyFace(44,H-28,1);txt(msg,170,H-25,'#ffd21e',1,true)}
  if(state==='done')done(now);
 }
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
// test hook
window.__cd={start:(p)=>{players=p||1;startRound()},state:()=>state,cars:()=>cars,boomAll:()=>{for(const c of cars.slice(1,3))explode(c)}};
