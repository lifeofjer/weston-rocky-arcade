 for(let r=0;r<ROCKYMAP.length;r++)for(let c=0;c<14;c++){const ch=ROCKYMAP[r][c];if(ch==='.')continue;g.fillStyle=P[ch];g.fillRect(x+c*sc,yy+r*sc,sc,sc)}
 // 5 legs, knobby, alternating step
 for(let i=0;i<5;i++){const lx=x+(1+i*2.8)*sc,step=((t/150|0)+i)%2;g.fillStyle='#4a3d30';g.fillRect(lx,yy+6*sc,sc,(3+step)*sc);g.fillRect(lx+(i<2?-sc:i>2?sc:0),yy+(9+step)*sc,sc,sc)}
}

 if(pokeT>0){pokeT--;const bw=textW(poke)+8;g.fillStyle='#fff';g.fillRect(rx+20-bw/2,ry-24-rb,bw,11);g.fillRect(rx+18,ry-13-rb,3,3);txt(poke,rx+20,ry-22-rb,'#000',1,true)}
 // progress bar
 g.fillStyle='#000';g.fillRect(38,140,244,14);g.fillStyle='#555';g.fillRect(40,142,240,10);

 for(let x=40+((now/40|0)%12);x<40+pw;x+=12){g.fillStyle='rgba(255,255,255,.25)';g.fillRect(x,144,4,8)}

 for(const e of CELLS){g.fillStyle=e.c/26<k?cellCol(e.ch,true,p):cellCol(e.ch,false);g.fillRect(BX+e.c*BS,BY+e.r*BS,BS,BS)}

// ---------- stunt game ----------
const GY=166;let segs=[],genX=0,stars=[],barrels=[],car,camX,score,starsGot,best=+(localStorage.getItem('rockyMegaBest')||0),parts=[],shake=0,crashT=0,rmsg='',rmsgT=0,dist=0;
function addSeg(type,len,h=0){segs.push({type,x0:genX,x1:genX+len,h});genX+=len}
function gen(){while(genX<camX+700){const sp=car?car.speed:2.6,r=Math.random();
 if(genX<400){addSeg('flat',400-genX);continue}
 if(r<.3){addSeg('flat',60+Math.random()*120);const gl=40+Math.random()*30*(sp/2.6);const gx=genX;addSeg('gap',gl);stars.push({x:gx+gl/2,y:GY-60,got:false})}
 else if(r<.55){addSeg('flat',70+Math.random()*60);const rx=genX;addSeg('ramp',50,26);const gl=70+Math.random()*40*(sp/2.6);addSeg('gap',gl);for(let i=0;i<3;i++)stars.push({x:rx+60+i*gl/3,y:GY-80-i*4,got:false})}
 else if(r<.78){addSeg('flat',140+Math.random()*80);barrels.push({x:genX-70});stars.push({x:genX-70,y:GY-50,got:false})}
 else{addSeg('flat',100+Math.random()*100);for(let i=0;i<3;i++)stars.push({x:genX-80+i*18,y:GY-14,got:false})}}}

function startRun(){segs=[];stars=[];barrels=[];parts=[];genX=0;camX=0;car={x:60,y:GY,vy:0,ground:true,speed:2.6,spin:0,rot:0,alive:true,slope:0};score=0;starsGot=0;dist=0;gen();state='play';rmsg='ROCKY: GO GO GO!';rmsgT=90;tune([392,523,659],90)}
function jump(){if(state!=='play'||!car.alive)return;if(car.ground){car.vy=-4.7-car.slope*car.speed*1.2;car.ground=false;snd(330,.15,'square',.05,2.2)}}
function crash(why){car.alive=false;crashT=0;shake=10;boom();
 for(let i=0;i<40;i++){const a=Math.random()*6.28,s=Math.random()*3+.3;parts.push({x:car.x+13,y:car.y-5,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,t:30+Math.random()*30,type:'fire'})}
 for(let i=0;i<16;i++){const a=Math.random()*6.28,s=Math.random()*3+1;parts.push({x:car.x+13,y:car.y-5,vx:Math.cos(a)*s,vy:-Math.random()*4-1,t:120,type:'part',col:i<4?'#151515':(i%2?PAINTS[paint].k:'#fff'),rot:Math.random()*6})}
 score=Math.floor(dist/10)+starsGot*10;if(score>best){best=score;localStorage.setItem('rockyMegaBest',best)}
 rmsg=why==='hole'?'ROCKY: CAR FELL IN HOLE! OOPS OOPS':'ROCKY: BOOM! BARREL WIN. HA HA';rmsgT=9999;state='crashed'}
function updatePlay(dt){
 if(car.alive){
  car.speed=Math.min(4.6,2.6+dist/6000);const dx=car.speed*dt;car.x+=dx;dist+=dx;camX=car.x-60;car.spin+=dx/3;
  const gd=groundAt(car.x+13);
  if(car.ground){
   if(!gd||gd.y>car.y+3){car.ground=false;car.vy=-car.slope*car.speed*2.3;if(car.slope>0){snd(500,.3,'square',.05,2);rmsg='ROCKY: WHEEEE! AMAZE!';rmsgT=60}}
   else{car.y=gd.y;car.slope=gd.slope;car.vy=0}}
  else{car.vy+=.2*dt;car.y+=car.vy*dt;car.rot=Math.max(-.5,Math.min(.5,car.vy*.08));
   if(gd&&car.vy>=0&&car.y>=gd.y&&car.y-gd.y<10){car.y=gd.y;car.ground=true;car.slope=gd.slope;car.rot=0;snd(120,.08,'square',.05);for(let i=0;i<6;i++)parts.push({x:car.x+Math.random()*26,y:car.y,vx:Math.random()*2-1,vy:-Math.random(),t:20,type:'dust'})}
   if(gd&&car.y>gd.y+10&&car.y<gd.y+40&&car.vy>=0){/* hit the side of a cliff */crash('hole')}}
  if(car.ground)car.rot=-Math.atan(car.slope);
  if(car.alive&&car.y>H+20)crash('hole');
  for(const b of barrels)if(car.alive&&!b.hit&&Math.abs(car.x+13-(b.x+4))<22&&car.y>GY-9){b.hit=true;crash('barrel')}

 }else crashT+=dt;
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.type==='part'){p.vy+=.15*dt;p.rot+=.2}p.t-=dt}parts=parts.filter(p=>p.t>0);

 // far city
 for(let i=0;i<30;i++){const bw=14+(i*7)%12,bh=40+(i*37)%70,x=((i*26-camX*.25)%780+780)%780-40;g.fillStyle='#7a94b8';g.fillRect(x,GY-bh+10,bw,bh);}
 // near city
 for(let i=0;i<22;i++){const bw=18+(i*11)%14,bh=30+(i*53)%60,x=((i*40-camX*.5)%880+880)%880-40;g.fillStyle='#4d5f7f';g.fillRect(x,GY-bh+14,bw,bh);g.fillStyle='#ffe98a';for(let wy=GY-bh+18;wy<GY;wy+=6)for(let wx=x+3;wx<x+bw-3;wx+=5)if((wx*7+wy*3+i)%4)g.fillRect(wx,wy,2,3)}}
function drawWorld(now){
 for(const s of segs){const x0=s.x0-camX,x1=s.x1-camX;if(x1<0||x0>W)continue;
  if(s.type==='flat'){g.fillStyle='#3b3b45';g.fillRect(x0,GY,x1-x0,6);g.fillStyle='#e8e8a0';for(let x=Math.ceil(s.x0/24)*24;x<s.x1-10;x+=24)g.fillRect(x-camX,GY+2,10,1);g.fillStyle='#6b4a2a';g.fillRect(x0,GY+6,x1-x0,H-GY);g.fillStyle='#4a2f18';g.fillRect(x0,GY+6,x1-x0,2)}
  else if(s.type==='ramp'){g.fillStyle='#6b4a2a';g.fillRect(x0,GY+6,x1-x0,H-GY);g.fillStyle='#3b3b45';g.fillRect(x0,GY,x1-x0,6);
   for(let x=0;x<x1-x0;x++){const hh=s.h*x/(x1-x0);g.fillStyle=((x+s.x0)/4|0)%2?'#ffd21e':'#222';g.fillRect(x0+x,GY-hh,1,hh)}
   g.fillStyle='#8a6a00';g.fillRect(x1-2,GY-s.h,2,s.h)}
  else{g.fillStyle='#000';g.fillRect(x0,GY+20,x1-x0,H);txt('JUMP!',(x0+x1)/2,GY+8,(now/250|0)%2?'#ff4040':'#ffd21e',1,true)}}
 for(const b of barrels){const x=b.x-camX;if(b.hit)continue;g.fillStyle='#e02020';g.fillRect(x,GY-10,8,10);g.fillStyle='#ffd21e';g.fillRect(x,GY-7,8,2);g.fillStyle='#ff7070';g.fillRect(x+1,GY-9,2,6)}
 for(const s of stars){if(s.got)continue;const x=s.x-camX,y=s.y+Math.sin(now/200+s.x)*2;g.fillStyle='#ffd21e';g.fillRect(x-1,y-4,3,9);g.fillRect(x-4,y-1,9,3);g.fillStyle='#fff6a0';g.fillRect(x,y-1,1,1)}}
function drawCar(now){if(!car.alive)return;const p=PAINTS[paint];g.save();g.translate(car.x-camX+13,car.y);g.rotate(car.rot);g.scale(1.6,1.6);
 // draw cells relative so bottom center at origin
 for(const e of CELLS){let ch=e.ch;if(e.r===8&&(e.c===4||e.c===5||e.c===18||e.c===19)&&((car.spin|0)%2))ch='o';g.fillStyle=cellCol(ch,true,p);g.fillRect(e.c-13,e.r-10,1,1)}
 if(car.ground&&(now/60|0)%2){g.fillStyle='rgba(200,200,200,.7)';g.fillRect(-16,-4,2,2)}
 g.restore()}
function drawParts(){for(const p of parts){if(p.type==='fire'){g.fillStyle=p.t>45?'#fff6a0':p.t>30?'#ffd21e':p.t>15?'#ff7a1a':'#b02010';g.fillRect(p.x-camX-2,p.y-2,4,4)}
 else if(p.type==='part'){g.save();g.translate(p.x-camX,p.y);g.rotate(p.rot);g.fillStyle=p.col;g.fillRect(-1,-1,3,3);g.restore()}
 else if(p.type==='dust'){g.fillStyle='rgba(200,180,150,.7)';g.fillRect(p.x-camX,p.y-2,2,2)}
 else if(p.type==='txt')shadowTxt(p.s,p.x-camX,p.y-8,'#ffd21e',1,true)}}
function playScreen(now,dt){if(state==='play'||state==='crashed')updatePlay(dt);
 g.save();if(shake>0)g.translate((Math.random()*2-1)*shake|0,(Math.random()*2-1)*shake|0);
 drawCity(now);drawWorld(now);drawCar(now);drawParts();g.restore();
 g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,0,W,13);txt('SCORE '+score,4,4,'#fff');txt('STARS '+starsGot,W/2,4,'#ffd21e',1,true);txt('BEST '+best,W-4-textW('BEST '+best),4,'#7cf');
 if(rmsgT>0){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(30,18,260,13);txt(rmsg,W/2,21,'#ffd21e',1,true)}
 if(state==='play'&&dist<300)shadowTxt('SPACE = JUMP!',W/2,60,'#fff',2,true);
 if(state==='crashed'&&crashT>40){g.fillStyle='rgba(0,0,0,.7)';g.fillRect(50,60,220,70);shadowTxt('CRASH!',W/2,66,'#ff4040',3,true);txt('SCORE '+score+'   BEST '+best,W/2,92,'#fff',1,true);drawRocky(64,98,1,now,0);txt('ROCKY FIX CAR. AGAIN, QUESTION?',W/2+8,104,'#ffd21e',1,true);if((now/400|0)%2)txt('SPACE = DRIVE AGAIN',W/2,118,'#4cff6a',1,true)}}
// ---------- input ----------
function press(code){const a0=ac();if(a0&&a0.state==='running')soundOn=true;
 if(state==='load'){poke=POKES[Math.random()*POKES.length|0];pokeT=70;rockyBounce=8;snd(523+Math.random()*400,.1,'triangle',.06);return}
 if(state==='ready'){if(code==='ArrowRight'||code==='KeyD'){paint=(paint+1)%6;snd(600,.05)}else if(code==='ArrowLeft'||code==='KeyA'){paint=(paint+5)%6;snd(600,.05)}else if(code==='Space'||code==='Enter'||code==='tap')startRun();return}
 if(state==='play'){if(code==='Space'||code==='ArrowUp'||code==='KeyW'||code==='tap')jump();return}
 if(state==='crashed'&&crashT>40&&(code==='Space'||code==='Enter'||code==='tap'))startRun()}
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();ac();if(e.repeat)return;press(e.code)});
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();press('tap')});
let last=performance.now();
function loop(now){const dt=Math.min((now-last)/16.67,3);last=now;
 if(state==='load')loadScreen(now);else if(state==='ready')readyScreen(now);else playScreen(now,dt);
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
window.__bl={state:()=>state,car:()=>car,start:startRun};
</script></body></html>
