 if(p.type==='fire'){g.fillStyle=k>.7?'#fff6a0':k>.45?'#ffd21e':k>.2?'#ff7a1a':'#b02010';const s=p.sz*(0.6+k);g.fillRect(p.x-s/2,p.y-s/2,s,s)}
 else if(p.type==='smoke'){g.fillStyle='rgba(70,70,70,'+(k*.6)+')';const s=p.sz*(1.6-k);g.fillRect(p.x-s/2,p.y-s/2,s,s)}
 else if(p.type==='spark'){g.fillStyle=k>.5?'#fff':'#ffd21e';g.fillRect(p.x,p.y,1,1)}
 else if(p.type==='ring'){g.strokeStyle='rgba(255,240,160,'+k+')';g.lineWidth=2;g.beginPath();g.arc(p.x,p.y,(1-k)*p.r,0,7);g.stroke()}
 else if(p.type==='part'){g.save();g.translate(p.x,p.y-p.z*4);g.rotate(p.rot);g.fillStyle=p.col;g.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz);g.restore()}}}

 const f=me||cat;if(f&&(now/250|0)%2){g.fillStyle=cat?'#ff9a3a':'#fff';g.fillRect(x0+f.x*sx-1.5,y0+f.y*sy-1.5,3,3)}
 g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=1;g.strokeRect(x0+camX*sx+.5,y0+camY*sy+.5,W*sx,H*sy)}
function hud(){g.fillStyle='#10102c';g.fillRect(0,0,W,TOP);
 if(me){txt('CRASH',4,4,'#fff');const n=me.crashes;txt(n+'/15',31,4,n>=12?'#ff4040':'#ffd21e');for(let i=0;i<15;i++){g.fillStyle=i<n?(i>=11?'#ff3b3b':'#ffd21e'):'#333';g.fillRect(56+i*4,4,3,6)}}
 else txt('CAT MODE: FIND A CAR!',4,4,'#ff9a3a');
 txt('TOTAL '+totalCrashes,122,4,'#7cf');txt('CARS '+carsUsed,172,4,'#4cff6a');const bs='BEST '+best;txt(bs,W-4-textW(bs),4,'#ffd21e');
 if(me&&214+textW(ROSTER[me.ci].name)<W-8-textW(bs))txt(ROSTER[me.ci].name,214,4,'#aaa')}
function title(now){g.fillStyle='#0d1530';g.fillRect(0,0,W,H);g.drawImage(CITY,(now/20)%(WW-W),300,W,H,0,0,W,H);g.fillStyle='rgba(10,10,40,.6)';g.fillRect(0,0,W,H);
 shadowTxt('CAT CITY',W/2,22,'#ff9a3a',4,true);shadowTxt('CRASH',W/2,54,'#ff4040',4,true);
 cat={x:0,y:0,a:-Math.PI/2+Math.sin(now/600)*.3,step:now/60,moving:true};g.save();g.translate(W/2,118);g.scale(3,3);g.translate(-0,0);drawCatAt(0,0,now);g.restore();cat=null;
 g.save();g.translate(70,120);g.rotate(Math.sin(now/500)*.1);g.drawImage(spriteImg(0),-12,-36,24,72);g.restore();g.save();g.translate(250,120);g.drawImage(spriteImg(1),-12,-17,24,33);g.restore();

 if((now/400|0)%2)shadowTxt('PRESS SPACE TO START',W/2,176,'#4cff6a',1,true);txt('BY WESTON AND ROCKY',W/2,188,'#7cf',1,true);rocky(296,186)}

function loop(now){const dt=Math.min((now-last)/16.67,3);last=now;
 if(state==='title')title(now);
 else{update(dt);g.save();g.translate(-Math.round(camX)+(shake?rand(-shake,shake)|0:0),-Math.round(camY)+(shake?rand(-shake,shake)|0:0));
  g.drawImage(CITY,Math.max(0,camX|0),Math.max(0,camY|0),W,H,Math.max(0,camX|0),Math.max(0,camY|0),W,H);

  if(state==='drive'&&me&&ROSTER[me.ci].siren&&msgT<=0)txt('H = SIREN',6,H-10,'#fff')}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
